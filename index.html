<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}
h1 {
  text-align: center;
  background: #2a72d4;
  color: white;
  padding: 20px;
}
.container {
  width: 90%;
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}
.item {
  display: flex;
  justify-content: space-between;
  margin: 12px 0;
  font-size: 18px;
}
input[type="number"] {
  width: 70px;
  text-align: center;
}
#celkem, #pocet {
  text-align: center;
  font-size: 22px;
  margin-top: 15px;
  font-weight: bold;
  color: #2a72d4;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  font-size: 24px;
  background: #ff6b35;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
button:hover {
  background: #e85a28;
}

/* ------------------------------------------------------------- */
/* STYLING PRO NOVÁ FORMULÁŘOVÁ POLE                             */
/* ------------------------------------------------------------- */
.form-group {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
}
.form-group label {
  font-size: 14px;
  font-weight: bold;
  color: #333;
  margin-bottom: 5px;
}
.form-group input[type="text"], 
.form-group input[type="tel"] {
  padding: 10px;
  font-size: 16px;
  border: 2px solid #ccc;
  border-radius: 6px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus {
  border-color: #2a72d4;
}
/* ------------------------------------------------------------- */
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">
  <div id="items"></div>

  <div id="celkem">Celková cena: 0 Kč</div>
  <div id="pocet">Počet kusů: 0</div>

  <div class="form-group">
    <label for="zakaznik-jmeno">Veronika Ostřanská (zapisujte ve formátu Příjmení Jméno):</label>
    <input type="text" id="zakaznik-jmeno" placeholder="Např. Ostřanská Veronika" required>
  </div>

  <div class="form-group">
    <label for="zakaznik-telefon">TELEFON:</label>
    <input type="tel" id="zakaznik-telefon" placeholder="+420 731567908" required>
  </div>
  <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>
</div>

<script>

let items = [];

// ✅ načítání CSV
async function loadCSV() {
  try {
    const response = await fetch("data_bufet.csv?t=" + Date.now());
    if (!response.ok) {
      throw new Error("Soubor nebyl nalezen");
    }

    const text = await response.text();
    parseCSV(text);
    renderItems();

  } catch (err) {
    console.error(err);
    alert("Chyba načítání CSV.");
  }
}

// ✅ parsování CSV (přeskočení hlavičku)
function parseCSV(text) {
  items = [];

  const lines = text.split("\n");

  // ⬇️ přeskočíme první řádek (hlavičku)
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();

    if (!line) continue;

    const [nazev, cena] = line.split(";");

    if (nazev && cena) {
      items.push({
        nazev: nazev.trim(),
        cena: parseFloat(cena.replace(",", ".")),
        mnozstvi: 0
      });
    }
  }
}

// ✅ vykreslení
function renderItems() {
  const container = document.getElementById("items");
  container.innerHTML = "";

  items.forEach((item, index) => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <span>${item.nazev} (${item.cena} Kč)</span>
      <input type="number" min="0" value="0"
        onchange="updateItem(${index}, this.value)">
    `;

    container.appendChild(div);
  });
}

// ✅ změna množství
function updateItem(index, value) {
  items[index].mnozstvi = parseInt(value) || 0;
  updateSummary();
}

// Globální proměnné pro uložení celkových hodnot pro e-mail
let celkovaCenaProEmail = 0;
let celkovyPocetProEmail = 0;

// ✅ přepočet
function updateSummary() {
  let celkem = 0;
  let pocet = 0;

  items.forEach(item => {
    celkem += item.cena * item.mnozstvi;
    pocet += item.mnozstvi;
  });

  celkovaCenaProEmail = celkem;
  celkovyPocetProEmail = pocet;

  document.getElementById("celkem").innerText =
    "Celková cena: " + celkem.toFixed(2) + " Kč";

  document.getElementById("pocet").innerText =
    "Počet kusů: " + pocet;
}

// =============================================================
// SEKCE: FUNKCE PRO VALIDACI A GENERování E-MAILU (MAILTO)
// =============================================================
function odeslatObjednavku() {
  // 1. Načtení hodnot z textových polí
  const jmeno = document.getElementById("zakaznik-jmeno").value.trim();
  const telefon = document.getElementById("zakaznik-telefon").value.trim();

  // 2. Kontrola vyplnění textových polí
  if (!jmeno) {
    alert("Prosím, vyplňte jméno ve formátu Příjmení Jméno.");
    document.getElementById("zakaznik-jmeno").focus();
    return;
  }

  if (!telefon) {
    alert("Prosím, vyplňte Vaše telefonní číslo.");
    document.getElementById("zakaznik-telefon").focus();
    return;
  }

  // 3. Kontrola, zda byla vybrána alespoň jedna položka
  const objednanePolozky = items.filter(item => item.mnozstvi > 0);

  if (objednanePolozky.length === 0) {
    alert("Nevybral jsi žádné položky!");
    return;
  }

  // 4. Sestavení těla e-mailové zprávy
  let emailBody = `Objednávka bufetu\n`;
  emailBody += `==================================\n`;
  emailBody += `Zákazník: ${jmeno}\n`;
  emailBody += `Telefon: ${telefon}\n`;
  emailBody += `==================================\n\n`;
  emailBody += `Objednané položky:\n`;

  objednanePolozky.forEach(item => {
    const mezisoucet = item.cena * item.mnozstvi;
    emailBody += `- ${item.nazev}: ${item.mnozstvi} ks (Cena/ks: ${item.cena} Kč, Mezisoučet: ${mezisoucet.toFixed(2)} Kč)\n`;
  });

  emailBody += `\n----------------------------------\n`;
  emailBody += `Celkový počet kusů: ${celkovyPocetProEmail}\n`;
  emailBody += `Celková cena objednávky: ${celkovaCenaProEmail.toFixed(2)} Kč\n`;
  emailBody += `----------------------------------\n`;

  // 5. Nastavení adresáta a předmětu zprávy
  const emailPrijemce = "veronika.ostranska@kostka-skola.cz";
  const emailPredmet = "Nová objednávka z bufetu - " + jmeno;

  // 6. Zakódování textu do mailto odkazu (ošetření mezer a diakritiky)
  const mailtoUrl = `mailto:${emailPrijemce}?subject=${encodeURIComponent(emailPredmet)}&body=${encodeURIComponent(emailBody)}`;

  // 7. Vyvolání akce otevření e-mailového programu
  window.location.href = mailtoUrl;
}
// =============================================================

// start
loadCSV();

</script>

</body>
</html>
