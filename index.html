<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SŠ Kostka – OBJEDNÁVKY BUFET</title>
    <style>
        /* Jednoduchý styling, aby to vypadalo jako na tvých obrázcích */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #2b78e4;
            color: white;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 30px;
            margin-top: 30px;
            width: 90%;
            max-width: 500px;
        }
        .summary-info {
            text-align: center;
            color: #2b78e4;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .summary-info div {
            margin: 5px 0;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .item-label {
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        .item-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group {
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
        }
        .form-group input::placeholder {
            color: #aaa;
        }
        .submit-btn {
            background-color: #ff6f3c;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #e55e2b;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        SŠ Kostka – OBJEDNÁVKY BUFET
    </div>

    <div class="container">
        <form id="orderForm">
            
            <div class="summary-info">
                <div>Celková cena: <span id="totalPrice">0</span> Kč</div>
                <div>Počet kusů: <span id="totalItems">0</span></div>
            </div>

            <div class="item-row">
                <span class="item-label">Sendvič (45 Kč)</span>
                <input type="number" class="item-input" data-name="Sendvič" data-price="45" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Párek v rohlíku (35 Kč)</span>
                <input type="number" class="item-input" data-name="Párek v rohlíku" data-price="35" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Jablko (15 Kč)</span>
                <input type="number" class="item-input" data-name="Jablko" data-price="15" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Banán (26 Kč)</span>
                <input type="number" class="item-input" data-name="Banán" data-price="26" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Mrkev (kus) (5 Kč)</span>
                <input type="number" class="item-input" data-name="Mrkev (kus)" data-price="5" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Tatranka (18 Kč)</span>
                <input type="number" class="item-input" data-name="Tatranka" data-price="18" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Pomeranč (kus) (10 Kč)</span>
                <input type="number" class="item-input" data-name="Pomeranč (kus)" data-price="10" value="0" min="0">
            </div>
            <div class="item-row">
                <span class="item-label">Kebab (50 Kč)</span>
                <input type="number" class="item-input" data-name="Redbull" data-price="32" value="0" min="0">
            </div>

            <hr>

            <div class="form-group">
                <label for="customerName">Veronika Ostřanská (zapisujte ve formátu Příjmení Jméno):</label>
                <input type="text" id="customerName" placeholder="Např. Ostřanská Veronika" required>
            </div>

            <div class="form-group">
                <label for="customerPhone">TELEFON:</label>
                <input type="tel" id="customerPhone" placeholder="+420 731567908" required>
            </div>
            <button type="submit" class="submit-btn">Odeslat objednávku</button>

        </form>
    </div>

    <script>
        // Výběr všech inputů pro množství
        const inputs = document.querySelectorAll('.item-input');
        const totalPriceEl = document.getElementById('totalPrice');
        const totalItemsEl = document.getElementById('totalItems');
        const form = document.getElementById('orderForm');

        // Funkce pro přepočítání ceny a kusů
        function calculateTotal() {
            let totalCost = 0;
            let totalCount = 0;

            inputs.forEach(input => {
                const quantity = parseInt(input.value) || 0;
                const price = parseInt(input.getAttribute('data-price'));

                totalCost += quantity * price;
                totalCount += quantity;
            });

            // Vpsání výsledků do HTML
            totalPriceEl.textContent = totalCost;
            totalItemsEl.textContent = totalCount;
        }

        // Naslouchání na změnu hodnoty v jakémkoliv inputu
        inputs.forEach(input => {
            input.addEventListener('input', calculateTotal);
            // Kdyby se klikalo na šipky nahoru/dolů
            input.addEventListener('change', calculateTotal); 
        });

        // =============================================================
        // UPRAVENO: NOVÁ FUNKCE S FUNKČNÍM MAILTO ODKAZEM PRO E-MAIL
        // =============================================================
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Zastaví výchozí odeslání/přenačtení stránky

            // 1. Načtení hodnot z polí Jméno a Telefon
            const jmeno = document.getElementById('customerName').value.trim();
            const telefon = document.getElementById('customerPhone').value.trim();

            // 2. Kontrola, zda uživatel vybral aspoň 1 kus něčeho
            let celkovyPocetKusu = parseInt(totalItemsEl.textContent) || 0;
            if (celkovyPocetKusu === 0) {
                alert('Nevybral(a) jsi žádné zboží k objednání!');
                return;
            }

            // 3. Sestavení textu objednávky (tělo mailu)
            let emailBody = `Objednávka bufetu\n`;
            emailBody += `==================================\n`;
            emailBody += `Zákazník: ${jmeno}\n`;
            emailBody += `Telefon: ${telefon}\n`;
            emailBody += `==================================\n\n`;
            emailBody += `Objednané položky:\n`;

            // Projdeme položky a přidáme do textu jen ty, kde je množství větší než 0
            inputs.forEach(input => {
                const mnozstvi = parseInt(input.value) || 0;
                if (mnozstvi > 0) {
                    const nazev = input.getAttribute('data-name');
                    const cenaZaKs = input.getAttribute('data-price');
                    const mezisoucet = mnozstvi * parseInt(cenaZaKs);
                    emailBody += `- ${nazev}: ${mnozstvi} ks (Cena/ks: ${cenaZaKs} Kč, Celkem: ${mezisoucet} Kč)\n`;
                }
            });

            emailBody += `\n----------------------------------\n`;
            emailBody += `Celkový počet kusů: ${celkovyPocetKusu}\n`;
            emailBody += `Celková cena objednávky: ${totalPriceEl.textContent} Kč\n`;
            emailBody += `----------------------------------\n`;

            // 4. Parametry e-mailu
            const emailPrijemce = "veronika.ostranska@kostka-skola.cz";
            const emailPredmet = "Nová objednávka z bufetu - " + jmeno;

            // 5. Vytvoření mailto odkazu se zakódováním diakritiky
            const mailtoUrl = `mailto:${emailPrijemce}?subject=${encodeURIComponent(emailPredmet)}&body=${encodeURIComponent(emailBody)}`;

            // 6. Otevření mailového klienta
            window.location.href = mailtoUrl;
        });
        // =============================================================
    </script>

</body>
</html>
